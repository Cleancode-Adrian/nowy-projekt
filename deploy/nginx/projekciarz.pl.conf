# /etc/nginx/sites-available/projekciarz.pl
#
# Kluczowa rzecz: root wskazuje na podkatalog public/, a NIE na korzeń
# repozytorium. Przy roocie na /var/www/projekciarz.pl plik .env, katalog .git
# i baza byłyby do pobrania przez HTTP.

server {
    listen 80;
    listen [::]:80;
    server_name projekciarz.pl www.projekciarz.pl;

    return 301 https://projekciarz.pl$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.projekciarz.pl;

    ssl_certificate     /etc/letsencrypt/live/projekciarz.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/projekciarz.pl/privkey.pem;

    return 301 https://projekciarz.pl$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name projekciarz.pl;

    root /var/www/projekciarz.pl/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/projekciarz.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/projekciarz.pl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    charset utf-8;
    client_max_body_size 12M;

    access_log /var/log/nginx/projekciarz.access.log;
    error_log  /var/log/nginx/projekciarz.error.log;

    # --- Kompresja ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # --- Blokady ---

    # Pliki wgrane przez użytkowników NIGDY nie mogą zostać wykonane jako PHP.
    location ~* ^/storage/.*\.(php|php[0-9]?|phtml|phar|cgi|pl|py|sh)$ {
        deny all;
        return 404;
    }

    # Kropkowane pliki (.env, .git, .htaccess) - poza well-known dla certbota.
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    # UWAGA: nginx wybiera PIERWSZY pasujący blok regex, więc wyjątek dla
    # manifestu Vite musi stać przed blokadą rozszerzeń.
    location ~* ^/build/.* {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Zrzuty bazy i kopie zapasowe, gdyby kiedyś trafiły do webroota.
    location ~* \.(sql|sqlite|db|dump|bak|backup|log|ini|yml|yaml|lock)$ {
        deny all;
        return 404;
    }

    # --- Cache statyków ---
    location ~* \.(jpg|jpeg|png|gif|webp|avif|ico|css|js|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # --- Laravel ---
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
        internal;
    }

    # Żaden inny plik .php nie jest punktem wejścia.
    location ~ \.php$ {
        return 404;
    }
}
